[project]
name = "multimarket-bess-optimizer"
version = "0.2.0"
description = "Leakage-controlled multi-market BESS research prototype"
requires-python = ">=3.11"
dependencies = [
  "highspy",
  "httpx",
  "lightgbm",
  "numpy",
  "pandas",
  "pyarrow",
  "pydantic-settings",
  "pyomo",
  "scikit-learn>=1.9.1",
  "scipy",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
